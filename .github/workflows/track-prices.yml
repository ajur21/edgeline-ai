# The hourly run between the two odds runs (no Odds API requests, ever): grades every pick whose game has finished
# from the free score sources (ESPN's scoreboard, then SportsGameOdds' results) and, when it grades anything, rewrites
# data/performance.js so results land within the hour; pulls DraftKings' open and current numbers from ESPN and, for
# games within eight hours of tip-off, every book's price from SportsGameOdds, for every pick on the board; rebuilds
# the breakdowns and rewrites data/picks.js (the day's card, started and graded picks included) and the feeds.
# Commits and redeploys when any of those files changed.
# Runs hourly for sixteen hours, 10 AM to 1 AM Eastern (15:00-06:00 UTC), and on demand.
name: Track prices

on:
  schedule:
    - cron: "0 15-23 * * *"
    - cron: "0 0-6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # The branch head when the job starts, not the commit current when the run was queued: a run that waited behind
      # the other data job must build on (and push after) the log that job just committed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grade finished games, refresh DraftKings numbers from ESPN and rebuild breakdowns
        run: node scripts/update-data.js --track
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
      # The NFL week hub's hourly step: states, scores and grades for the week's games (one ESPN request, and none when
      # no game is in play); it never touches a projection, spends nothing and never fails the job.
      - name: Track the NFL week (ESPN, no key)
        run: node scripts/nfl-week.js --track || echo "::warning::NFL week tracking failed; keeping the previous data/nfl-week.js"
      - name: Rebuild the pick feeds (calendar + RSS)
        run: node scripts/feeds.js
      # What a track run writes: data/picks.js (the card), data/picks-log.json (grades, closes, prices),
      # data/performance.js (only when it graded something or repaired a close), data/props.js (when the SportsGameOdds
      # surplus re-read the lines of games starting within three hours), data/budget.json (the surplus spenders' state),
      # data/nfl-week.js and data/nfl-week-log.json (the NFL week's states, scores and grades), picks.ics and feed.xml. `git status` also sees a file the run created, which `git diff` would miss.
      - name: Commit data if it changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/picks.js data/picks-log.json data/performance.js data/props.js data/props-log.json data/budget.json data/nfl-week.js data/nfl-week-log.json picks.ics feed.xml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No movement."; exit 0
          fi
          git config user.name "edgeline-data-bot"
          git config user.email "edgeline-data-bot@users.noreply.github.com"
          git add -A -- data feed.xml picks.ics
          git commit -m "data: track prices and grade finished games ($(date -u +%Y-%m-%dT%H:%M))"
          # a code push can land while this run works; the run commits only data files, so replay it on top
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: track
    if: needs.track.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
