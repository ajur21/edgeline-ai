# Refreshes picks and results from The Odds API, commits the data files, and redeploys.
# Needs the ODDS_API_KEY repository secret. Runs twice daily, 14:00 UTC (9-10 AM Eastern; noon until 2026-11-05, moved
# earlier to catch prices nearer the open) and 20:30 UTC
# (3:30-4:30 PM Eastern, before the evening slates), and on demand.
# Since 2026-11-05 two Claude routines start the daily runs on time (workflow_dispatch with slot=morning / afternoon):
# GitHub's schedule fires hours late on this repo (the 11-04 noon run started at 22:15 UTC). The schedule stays as the
# fallback, and the gate job skips any run for a slot that a full run has already covered (scripts/slot-due.js), so a
# late duplicate never spends The Odds API's credits twice.
name: Update data

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      verbose:
        description: "Print every market's best edge (diagnostics; same credit cost)"
        type: boolean
        default: false
      props_only:
        description: "Skip the odds run; refresh only the props research, lines and team identity (no Odds API credits)"
        type: boolean
        default: false
      slot:
        description: "The daily slot this run fills (the routines set it): morning spends props lines on the NFL only; a slot already covered by a full run is skipped. manual always runs"
        type: choice
        options: [manual, morning, afternoon]
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  # a run for a daily slot (scheduled, or dispatched with slot) that a full run has already covered does nothing
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: due
        name: Is this slot still due?
        run: node scripts/slot-due.js
        env:
          SLOT_CRON: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the data group queues this behind the hourly run; start from its commit, not the one queued, or the push is rejected
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --slot: NFL and soccer are fetched on the afternoon run only, and a morning run gives way when the month's credits
      # run short (scripts/update-data.js, SPORTS); a scheduled run takes its slot from the cron line, a dispatch from the input
      - name: Pull odds, grade results, rewrite data files
        if: ${{ !inputs.props_only }}
        run: node scripts/update-data.js --slot ${{ github.event.schedule == '0 14 * * *' && 'morning' || github.event.schedule == '30 20 * * *' && 'afternoon' || inputs.slot || 'manual' }} ${{ inputs.verbose && '--verbose' || '' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
      # The NFL week hub (scripts/nfl-week.js): every game of the week projected by the production model, each forecast
      # locked at kickoff and graded straight up. ESPN and the National Weather Service only: no Odds API credit and no
      # SportsGameOdds entity (a game the odds run above has priced is read from data/ on disk). Never fails the job.
      - name: Project the NFL week (ESPN and the National Weather Service, no key)
        run: node scripts/nfl-week.js || echo "::warning::NFL week refresh failed; keeping the previous data/nfl-week.js"
      # Lines ride along from SportsGameOdds (one entity per game). The NBA's (about 14 a night) come on the afternoon
      # run and manual runs. The NFL's come on the morning run too (--lines nfl): Sunday's 9:30 AM and 1 PM kickoffs are
      # gone by the afternoon run. The NFL call is ESPN-gated inside the script: only on an NFL game day, only for the
      # games still to start (about 22 entities an NFL week; see CLAUDE.md, Props research and lines).
      - name: Refresh props research data, NFL then NBA (ESPN, no key), and the lines (SportsGameOdds)
        run: node scripts/update-props.js ${{ (github.event.schedule == '0 14 * * *' || inputs.slot == 'morning') && '--lines nfl' || '' }} || echo "::warning::props refresh failed; keeping the previous data/props.js"
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
      # The play of the day and the parlay of the day (scripts/of-day.js): chosen from every play of today's games, game
      # leans and player props together, so this runs after both the odds run and the props refresh. It locks on the
      # afternoon run, when game lines and prop lines are both in; a play that starts before then locks on the morning
      # run. The hourly workflow never chooses, it grades and republishes. No API call, no credit. Never fails the job:
      # nothing locks this run and the next one looks again.
      - name: Choose the play and parlay of the day (leans and props together, no key)
        run: node scripts/update-data.js --of-day --slot ${{ github.event.schedule == '0 14 * * *' && 'morning' || github.event.schedule == '30 20 * * *' && 'afternoon' || inputs.slot || 'manual' }} || echo "::warning::play of the day step failed; nothing locked this run"
      - name: Refresh team identity (logos and colours from ESPN, no key)
        run: node scripts/update-teams.js || echo "::warning::team refresh failed; keeping the previous data/teams.js"
      - name: Rebuild the pick feeds (calendar + RSS)
        run: node scripts/feeds.js
      - name: Commit data if it changed
        id: commit
        run: |
          if git diff --quiet -- data feed.xml picks.ics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."; exit 0
          fi
          git config user.name "edgeline-data-bot"
          git config user.email "edgeline-data-bot@users.noreply.github.com"
          git add data feed.xml picks.ics
          git commit -m "data: refresh picks and results ($(date -u +%Y-%m-%d))"
          # a code push can land while this run works; the run commits only data files, so replay it on top
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with the workflow token do not trigger pages.yml, so deploy here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
