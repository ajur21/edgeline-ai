# Refreshes picks and results from The Odds API, commits the data files, and redeploys.
# Needs the ODDS_API_KEY repository secret. Runs twice daily, 17:00 UTC (noon-1 PM Eastern) and 20:30 UTC
# (3:30-4:30 PM Eastern, before the evening slates), and on demand.
name: Update data

on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull odds, grade results, rewrite data files
        run: node scripts/update-data.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
      - name: Refresh NBA props research data (ESPN public API, no key)
        run: node scripts/update-props.js || echo "::warning::props refresh failed; keeping the previous data/props.js"
      - name: Commit data if it changed
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."; exit 0
          fi
          git config user.name "edgeline-data-bot"
          git config user.email "edgeline-data-bot@users.noreply.github.com"
          git add data
          git commit -m "data: refresh picks and results ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with the workflow token do not trigger pages.yml, so deploy here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
